name: Android CI & Phase 7 Acceptance

on:
  push:
    branches: [ feat/v1.3-offline-fortune ]
  pull_request:
    branches: [ feat/v1.3-offline-fortune ]
  workflow_dispatch:

jobs:
  test_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x StockFortuneAndroid/gradlew

      - name: Run Full Unit & Acceptance Tests (127 tests)
        working-directory: StockFortuneAndroid
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Debug APK
        working-directory: StockFortuneAndroid
        run: ./gradlew assembleDebug

      - name: Verify Pre-populated DB Size & SHA256
        working-directory: StockFortuneAndroid
        run: |
          sha256sum app/src/main/assets/databases/stock_fortune.db
          stat -c "%s bytes" app/src/main/assets/databases/stock_fortune.db
          sha256sum app/build/outputs/apk/debug/app-debug.apk
