name: Android CI & Phase 7 Acceptance

on:
  push:
    branches: [ feat/v1.3-offline-fortune, main ]
  pull_request:
    branches: [ feat/v1.3-offline-fortune, main ]
  workflow_dispatch:

jobs:
  test_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for scripts
        run: |
          chmod +x StockFortuneAndroid/gradlew
          chmod +x StockFortuneAndroid/tools/fetch_robolectric.sh
          chmod +x StockFortuneAndroid/tools/run_all_acceptance.sh

      - name: Cache Robolectric Dependencies
        uses: actions/cache@v4
        with:
          path: StockFortuneAndroid/build/robolectric-deps
          key: robolectric-${{ hashFiles('StockFortuneAndroid/tools/fetch_robolectric.sh') }}
          restore-keys: |
            robolectric-

      - name: Fetch Robolectric Pre-instrumented Jar
        working-directory: StockFortuneAndroid
        run: bash tools/fetch_robolectric.sh

      - name: Run Full Unit & Acceptance Tests in Android Runtime
        working-directory: StockFortuneAndroid
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Debug APK
        working-directory: StockFortuneAndroid
        run: ./gradlew assembleDebug

      - name: Verify Artifact Sizes & SHA256 Checksums
        working-directory: StockFortuneAndroid
        run: |
          echo "=== Databases & Rules Checksums ==="
          sha256sum app/src/main/assets/databases/stock_fortune.db
          stat -c "%s bytes" app/src/main/assets/databases/stock_fortune.db
          sha256sum app/src/main/assets/copywriting/copy_rules_frozen_281.json
          stat -c "%s bytes" app/src/main/assets/copywriting/copy_rules_frozen_281.json
          echo "=== APK Checksum & Size ==="
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          stat -c "%s bytes" app/build/outputs/apk/debug/app-debug.apk
